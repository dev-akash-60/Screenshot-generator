<!DOCTYPE html>
<html lang="en">
<head>
    <title>Screenshot Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Website Screenshot Generator</h1>

        <input id="url" type="text" placeholder="Enter website URL">
        <button onclick="capture()">Capture Screenshot</button>

        <div id="result">
            <img id="screenshot" alt="Screenshot will appear here">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
